<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل الدخول — فاتح</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1A1F25}a:hover{color:#0D1217}
</style>
</head>
<body>
<div dir="rtl" style="width: 1440px; height: 900px; box-sizing: border-box; background: #FFFFFF; color: #1A1F25; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column">
<section style="position: relative; height: 312px; flex: none; background: #1A1F25; color: #F7FBFF; overflow: hidden">

<div style="position: relative; height: 100%; box-sizing: border-box; padding: 0 160px; display: flex; flex-direction: column">
<div style="height: 88px; display: flex; align-items: center; justify-content: space-between">
<img src="masaha-logo-dark-berry.svg" alt="مساحة" style="height: 40px; width: auto; display: block">
<div style="display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; color: #C9D0D7">
<button type="button" lang="en" style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: inherit; font: inherit">English</button>
<button type="button" aria-label="المظهر الداكن" style="width: 44px; height: 44px; border: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding-bottom: 56px; max-width: 620px">
<h1 style="margin: 0; font-size: 56px; line-height: 1.2; font-weight: 600">تسجيل الدخول</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.7; color: #C9D0D7">لحفظ مساحاتك المفضّلة ومتابعة بلاغاتك، أو لإدارة مساحتك.</p>
</div>
</div>
</section>
<main style="flex: 1; box-sizing: border-box; padding: 0 160px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px">
<div style="grid-column: span 5; display: flex; flex-direction: column">
<form style="padding-top: 48px; display: flex; flex-direction: column; gap: 24px">
<button type="button" style="height: 40px; border: 1px solid #747775; border-radius: 4px; background: #FFFFFF; color: #1F1F1F; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>المواصلة باستخدام Google</button>
<div style="display: flex; align-items: center; gap: 12px; color: #767D84; font-size: 13px"><span style="flex: 1; height: 1px; background: #DDE5ED"></span>أو<span style="flex: 1; height: 1px; background: #DDE5ED"></span></div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500">البريد الإلكتروني<input type="email" placeholder="name@example.com" style="height: 44px; box-sizing: border-box; border: 1px solid #C9D0D7; border-radius: 8px; padding: 0 14px; font: inherit; font-size: 15px; direction: ltr; text-align: right; background: #FFFFFF"></label>
<div style="display: flex; flex-direction: column; gap: 8px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500">كلمة المرور<input type="password" style="height: 44px; box-sizing: border-box; border: 1px solid #C9D0D7; border-radius: 8px; padding: 0 14px; font: inherit; background: #FFFFFF"></label>
<a href="#" style="align-self: flex-start; font-size: 14px; font-weight: 500; text-underline-offset: 4px">نسيت كلمة المرور؟</a>
</div>
<button type="submit" style="height: 44px; border: 0; border-radius: 8px; background: #1A1F25; color: #F7FBFF; font: inherit; font-size: 15px; font-weight: 600">تسجيل الدخول</button>
</form>
</div>
<div style="grid-column: 7 / span 6; padding-top: 48px">
<div style="border-inline-start: 1px solid #DDE5ED; padding-inline-start: 48px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 22px; line-height: 1.55; font-weight: 600">جديد على مساحة؟</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5E646A">أنشئ حسابًا لتحفظ مساحاتك المفضّلة وتتابع البلاغات التي ترسلها.</p>
<a href="#" style="align-self: flex-start; height: 44px; padding: 0 20px; box-sizing: border-box; display: inline-flex; align-items: center; border: 1px solid #1A1F25; border-radius: 8px; text-decoration: none; font-size: 15px; font-weight: 600">إنشاء حساب</a>
<p style="margin: 16px 0 0; padding-top: 20px; border-top: 1px solid #ECF4FC; font-size: 13px; line-height: 1.7; color: #767D84">تدير مساحة عمل؟ حسابات أصحاب المساحات ينشئها فريق مساحة. <a href="#" style="font-weight: 500; text-underline-offset: 4px">تواصل معنا</a></p>
</div>
</div>
</main>
<footer style="height: 56px; flex: none; box-sizing: border-box; padding: 0 160px; display: flex; align-items: center; font-size: 13px; color: #767D84"><a href="#" style="color: #5E646A; text-underline-offset: 4px">سياسة الخصوصية</a></footer>
</div>
</body>
</html>

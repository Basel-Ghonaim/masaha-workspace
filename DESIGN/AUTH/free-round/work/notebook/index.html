<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول · مساحة</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Aref Ruqaa 700 (the hand), Markazi Text 400-600 (the print). The English hand only downloads on the English page. -->
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Markazi+Text:wght@400..600&family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
/* ============ Notebook · tokens ============ */
:root {
  --paper: #F7FBFF;           /* the brand ground, as exercise-book paper */
  --rule: rgba(63, 110, 153, .12);   /* 16px squares (2 x the 8px grid); every line of text sits on one */
  --margin-rule: #B55BB3;     /* the berry margin, drawn twice */
  --ink: #1A1F25;             /* 16 : 1 */
  --ink-2: #484E54;           /* n-700, 8.5 : 1: a step darker than the system's muted, for a thin serif */
  --pen: #934791;             /* s-600: the berry pen for written words, 5.7 : 1 */
  --pen-line: #B55BB3;        /* berry pen for lines that aren't text */
  --field: #FFFFFF;
  --line: #1A1F25;            /* fields are drawn in ink */
  --primary: #934791; --on-primary: #FFFFFF;   /* s-600, 5.9 : 1 */
  --error: #BE222A;           /* r-600: the red pen, 5.9 : 1 */
  --focus: #B55BB3;
  --gutter: rgba(26, 31, 37, .1);
  --base: 5px;                /* where the ruling sits so text stands on it (measured: Markazi 21/32 has its baseline 21px into the line) */

  --hand: 'Aref Ruqaa', 'Markazi Text', serif;
  --print: 'Markazi Text', 'Noto Naskh Arabic', 'Times New Roman', serif;
  --sq: 16px; --margin: 96px;
  --h1-nudge: 2px; --h2-nudge: 26px;   /* measured, so both titles stand on the same rule */
  color-scheme: light;
}
[lang="en"] { --hand: 'Kalam', 'Markazi Text', cursive; --h1-nudge: 8px; --h2-nudge: 24px; }
[data-theme="dark"] {
  --paper: #10161C;           /* the same notebook, under a lamp at night */
  --rule: rgba(150, 185, 220, .075);
  --margin-rule: #D27ED0;
  --ink: #EDF2F7;             /* 15.6 : 1 */
  --ink-2: #A9B5C1;           /* 8.3 : 1 */
  --pen: #E4A9E2;             /* 9.6 : 1 */
  --pen-line: #D27ED0;
  --field: #0A0F14;
  --line: #8D99A6;            /* 5.9 : 1 */
  --primary: #D27ED0; --on-primary: #0D1217;   /* 6.8 : 1 */
  --error: #FC6E68;           /* r-400, 6.8 : 1 */
  --focus: #D27ED0;
  --gutter: rgba(0, 0, 0, .45);
  color-scheme: dark;
}

/* ============ base: two print sizes (21 and 18), one leading (32 = two squares) ============ */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--print); font-size: 21px; line-height: 32px; color: var(--ink); background: var(--paper);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 3px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }

/* ============ the spread: two pages, the two ways in ============ */
.spread { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; position: relative; }
.page {
  position: relative; padding: 32px 64px 32px; padding-inline-start: calc(var(--margin) + 48px);
  background-color: var(--paper);
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: var(--sq) var(--sq); background-position: 0 var(--base);
  display: flex; flex-direction: column; min-width: 0;
}
.page > * { max-width: 400px; width: 100%; }
/* the margin, ruled twice in berry, on the side where the writing starts (the right, in Arabic) */
.page::before {
  content: ""; position: absolute; top: 0; bottom: 0; inset-inline-start: var(--margin); width: 7px;
  border-inline: 2px solid var(--margin-rule);
}
/* the fold between the pages */
.spread::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 64px; transform: translateX(-50%); pointer-events: none;
  background: linear-gradient(90deg, transparent, var(--gutter) 46%, var(--gutter) 54%, transparent);
}
.spread::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--gutter); z-index: 1; pointer-events: none; }

.head { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.brand { display: inline-flex; align-items: center; min-height: 48px; border-radius: 6px; }
.logo { height: 40px; width: auto; display: block; }
.logo-ink { fill: var(--ink); } .logo-berry { fill: var(--margin-rule); }
.switches { display: flex; gap: 8px; }
.switch {
  min-height: 48px; min-width: 48px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center;
  font: 600 18px/1 var(--print); color: var(--ink); text-decoration: none; background: var(--paper);
  border: 1.5px solid var(--ink); border-radius: 3px; cursor: pointer;
}
.switch:hover { background: var(--ink); color: var(--paper); }
.switch svg { width: 20px; height: 20px; }
#theme { padding: 0; }
#theme .sun { display: none; } [data-theme="dark"] #theme .sun { display: block; } [data-theme="dark"] #theme .moon { display: none; }

.page > .back { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; margin-top: 16px; font-size: 18px; color: var(--ink-2); text-decoration: none; width: auto; align-self: flex-start; }
.back span { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }
.back svg { width: 16px; height: 16px; }
[dir="ltr"] .chev { transform: scaleX(-1); }

/* the title is written, then underlined in berry, the way a lesson's title is */
h1 { font-family: var(--hand); font-weight: 700; font-size: 88px; line-height: 112px; margin: 0; padding-top: var(--h1-nudge, 2px); margin-bottom: calc(-1 * var(--h1-nudge, 2px)); }
[lang="en"] h1 { font-size: 80px; }
.title-wrap { display: inline-block; position: relative; vertical-align: top; }
.underline { position: absolute; inset-inline: -6px; bottom: 4px; width: calc(100% + 12px); height: 18px; overflow: visible; }
.underline path { fill: none; stroke: var(--pen-line); stroke-width: 3.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.underline .u2 { stroke-width: 2.5; opacity: .9; }
.lede { margin: 16px 0 0; color: var(--ink-2); }

.stack { display: flex; flex-direction: column; gap: 32px; margin-top: 32px; }

/* a note in the berry pen, with a line down its start side */
.note { margin: 0; padding-inline-start: 16px; border-inline-start: 3px solid var(--pen-line); color: var(--ink); }
.note svg { display: none; }
.note p { margin: 0; }

/* errors are written in red pen: a mark in the margin, the words in the hand, underlined */
.alert { position: relative; display: block; color: var(--ink); }
.alert > svg { display: none; }
.alert::before {
  content: "!"; position: absolute; top: -8px; width: 48px; text-align: center;
  inset-inline-start: calc(-1 * (var(--margin) + 48px) + (var(--margin) - 48px) / 2);
  font: 700 48px/48px var(--hand); color: var(--error);
}
.alert strong { display: block; font-family: var(--hand); font-weight: 700; font-size: 28px; line-height: 32px; color: var(--error);
  text-decoration: underline wavy var(--error); text-decoration-thickness: 1.5px; text-underline-offset: 10px; text-decoration-skip-ink: none; }
.alert p { margin: 0; }
.alert strong + p, .alert [data-alert-title] + [data-alert-body] { margin-top: 16px; }
.alert[data-kind="toomany"] p, .alert[data-kind="offline"] p { font-family: var(--hand); font-weight: 700; font-size: 26px; color: var(--error); }
.alert-google { margin-top: 16px; }

/* Google's own button: outline (light) / filled black (dark), 40px, rectangular; 4px above and below keep the squares */
.gsi {
  display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 400px; height: 40px; margin-block: 4px;
  padding: 0 12px; background: #FFFFFF; color: #3C4043; border: 1px solid #DADCE0; border-radius: 4px; cursor: pointer;
  font: 500 14px/1 'Google Sans', Roboto, 'Segoe UI', Arial, sans-serif; letter-spacing: .25px;
}
.gsi:hover { background: #F8FAFF; border-color: #D2E3FC; }
.gsi .g-logo { width: 18px; height: 18px; position: absolute; inset-inline-start: 12px; top: 10px; }
.gsi .g-disc { display: contents; }
[data-theme="dark"] .gsi { background: #202124; color: #FFFFFF; border-color: #202124; }
[data-theme="dark"] .gsi .g-disc { display: flex; position: absolute; inset-inline-start: 2px; top: 2px; width: 34px; height: 34px; border-radius: 3px; background: #FFFFFF; align-items: center; justify-content: center; }
[data-theme="dark"] .gsi .g-logo { position: static; }
[lang="ar"] .gsi { letter-spacing: 0; }

.or { display: flex; align-items: center; gap: 16px; color: var(--ink-2); font-size: 18px; line-height: 32px; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1.5px dashed var(--ink-2); opacity: .5; }

form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
label { font-size: 21px; font-weight: 600; line-height: 32px; }
.field-head a { font-size: 18px; color: var(--ink-2); text-underline-offset: 5px; position: relative; }
.field-head a::after, .owners a::after { content: ""; position: absolute; inset: -8px -4px; }  /* a 44px+ target, no layout shift */
.input-wrap { position: relative; }
input[type="email"], input[type="password"], input[type="text"] {
  width: 100%; height: 48px; padding: 0 16px; font: 400 21px/1 var(--print); color: var(--ink);
  background: var(--field); border: 1.5px solid var(--line); border-radius: 3px;
}
input::placeholder { color: var(--ink-2); opacity: 1; }
input:focus-visible { outline-offset: 2px; }
input[dir="ltr"] { text-align: left; }
.is-invalid input { border-color: var(--error); border-width: 2px; }
#password { padding-inline-end: 88px; }
.pw-toggle {
  position: absolute; inset-inline-end: 2px; top: 2px; height: 44px; min-width: 64px; padding: 0 16px; border: 0; border-radius: 2px;
  background: transparent; color: var(--ink-2); font: 600 18px/1 var(--print); cursor: pointer;
}
.pw-toggle:hover { color: var(--ink); }
.field-error { display: flex; gap: 8px; align-items: flex-start; margin: 0; color: var(--error); font-size: 18px; line-height: 32px; }
.field-error svg { width: 16px; height: 16px; flex: none; margin-top: 9px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 48px; padding: 0 24px; border-radius: 3px;
  font: 600 21px/1 var(--print); cursor: pointer; text-decoration: none; border: 0;
}
.btn-primary { width: 100%; background: var(--primary); color: var(--on-primary); margin-top: 16px; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary[aria-busy="true"] { cursor: progress; }
.spinner { display: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; border-inline-end-color: transparent; animation: spin .8s linear infinite; }
.btn-primary[aria-busy="true"] .spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

/* ============ the facing page: for people new to Masaha ============ */
/* its title sits on the same rule as the first page's title */
.page-2 { padding-top: calc(32px + 48px + 16px + 48px + var(--h2-nudge, 26px)); }
h2 { font-family: var(--hand); font-weight: 700; font-size: 56px; line-height: 96px; margin: 0 0 calc(16px - var(--h2-nudge)); }
[lang="en"] h2 { font-size: 52px; }
.btn-drawn { align-self: flex-start; width: auto; margin-top: 16px; background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); }
.btn-drawn:hover { background: var(--ink); color: var(--paper); }

.owners-block { position: relative; margin-top: 48px; }
.margin-note {
  position: absolute; inset-inline-start: calc(-1 * (var(--margin) + 48px)); width: calc(var(--margin) - 8px); top: 0; margin: 0; padding-inline: 8px;
  font-family: var(--hand); font-weight: 700; font-size: 22px; line-height: 32px; color: var(--pen); text-align: center;
  transform: rotate(-4deg);
}
[dir="ltr"] .margin-note { transform: rotate(-3deg); font-size: 20px; }
.owners { margin: 0; color: var(--ink-2); }
.owners a { color: var(--ink); font-weight: 600; text-underline-offset: 6px; white-space: nowrap; position: relative; }

.desk { margin: auto 0 0; padding-top: 32px; max-width: 448px; }
.sketch { width: 100%; height: auto; display: block; overflow: visible; }
.sketch .pen path, .sketch .pen rect, .sketch .pen circle { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.sketch .pen .thin { stroke-width: 1.6; }
.sketch .pen .hatch { stroke-width: 1.4; stroke: var(--pen-line); }
.sketch .pen .ray { stroke: var(--pen-line); stroke-width: 2.4; }
.sketch .pen .steam { stroke: var(--ink-2); }
.sketch .pen .berry-fill { fill: var(--pen-line); }
.sketch .pen .paper-fill { fill: var(--paper); }
.sketch .pen .nostroke { stroke: none; }
.sketch .night { display: none; }
[data-theme="dark"] .sketch .night { display: block; }
[data-theme="dark"] .sketch .pen .bulb { fill: #F7D2F6; }

.foot { margin-top: 16px; display: flex; }
.foot a { font-size: 18px; color: var(--ink-2); text-underline-offset: 5px; min-height: 48px; display: inline-flex; align-items: center; }

/* ============ phone: one page after the other ============ */
@media (max-width: 960px) {
  :root { --margin: 32px; --h1-nudge: 6px; --h2-nudge: 16px; }
  [lang="en"] { --h1-nudge: 5px; --h2-nudge: 8px; }
  .spread { grid-template-columns: minmax(0, 1fr); }
  .spread::after, .spread::before { display: none; }
  .page { padding: 16px 16px 32px; padding-inline-start: calc(var(--margin) + 16px); }
  .page-2 { padding-top: calc(32px + var(--h2-nudge)); box-shadow: inset 0 1px 0 var(--gutter), inset 0 16px 24px -20px var(--gutter); }
  .head .logo { height: 36px; }
  h1 { font-size: 64px; line-height: 96px; }
  [lang="en"] h1 { font-size: 60px; }
  h2 { font-size: 44px; line-height: 64px; }
  .stack { margin-top: 32px; gap: 32px; }
  .margin-note { position: static; width: auto; transform: none; text-align: start; padding: 0; margin-bottom: 0; }
  [dir="ltr"] .margin-note { transform: none; }
  .owners-block { margin-top: 32px; }
  .alert::before { inset-inline-start: calc(-1 * (var(--margin) + 16px)); width: var(--margin); font-size: 36px; }
}

</style>
</head>

      setTimeout(function () {
        setBusy(false);
        state.attempts += 1;
        if (!navigator.onLine) showAlert('offline', true);
        else showAlert(state.attempts >= 3 ? 'toomany' : 'wrong', true);
      }, 1400);
    });

    var g = $('#google');
    if (g) g.addEventListener('click', function () { showAlert('google', true); });

    var tg = $('#pw-toggle');
    if (tg) tg.addEventListener('click', function () {
      pw.type = pw.type === 'password' ? 'text' : 'password';
      refreshPasswordToggle();
    });

    var th = $('#theme');
    if (th) th.addEventListener('click', function () {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme(); syncUrl(); emit();
    });

    var lg = $('#lang');
    if (lg) lg.addEventListener('click', function (e) {
      e.preventDefault();
      state.lang = state.lang === 'ar' ? 'en' : 'ar';
      applyLang(); syncUrl(); emit();
    });

    $all('a[href="#"]').forEach(function (a) { if (a.id !== 'lang') a.addEventListener('click', function (e) { e.preventDefault(); }); });
  }

  /* ---------- mock-up states from the URL ---------- */
  function applyUrlState() {
    var s = params.get('state');
    var email = $('#email'), pw = $('#password');
    if (s === 'session') state.session = true;
    if (s === 'wrong' || s === 'toomany' || s === 'offline' || s === 'submitting') {
      email.value = 'name@example.com'; pw.value = 'masaha-2026';
    }
    if (s === 'wrong' || s === 'toomany' || s === 'offline') { alertKind = s; }
    if (s === 'google') { alertKind = 'google'; }
    if (s === 'submitting') { busy = true; }
    if (s === 'fields') {
      email.value = 'name@example'; pw.value = '';
      touched.email = touched.password = true; validate('email'); validate('password');
    }
    applyLang();
    var focusEl = s === 'fields' ? email : (s === 'wrong' || s === 'toomany' || s === 'offline') ? $('#alert') : s === 'google' ? $('#google-alert') : null;
    if (focusEl) focusEl.focus({ preventScroll: true });
  }

  window.Masaha = {
    STR: STR, SPACES: SPACES, OUTLINE: OUTLINE, state: state, t: t,
    onChange: function (fn) { listeners.push(fn); fn(state); }
  };

  function init() {
    if (params.get('capture')) root.setAttribute('data-capture', '');
    wire(); applyUrlState(); emit(); root.classList.add('is-ready');
    /* for the capture tool: the page's real height once fonts are in */
    var mark = function () { root.setAttribute('data-h', String(Math.ceil(document.documentElement.scrollHeight))); };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(mark, 60); }); else mark();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>

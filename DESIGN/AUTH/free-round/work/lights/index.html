<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول · مساحة</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- One variable family, Arabic + Latin, 400 to 700 only. -->
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ============ Lights · tokens ============ */
:root {
  --ink: #1A1F25;            /* n-900 */
  --ink-2: #5E646A;          /* n-600, 5.8 : 1 on ground */
  --ground: #F7FBFF;         /* n-50: the panel, and the Strip on the map */
  --field: #FFFFFF;
  --line: #767D84;           /* n-500, control borders, 4.0 : 1 */
  --hair: #DDE5ED;           /* n-200, separators only */
  --berry: #B55BB3;          /* s-500: a space on the map; the focus ring */
  --berry-fill: #934791;     /* s-600: the sign-in button, white text 5.9 : 1 */
  --on-berry: #FFFFFF;
  --error: #BE222A;          /* r-600, 5.9 : 1 */
  --error-bg: #FEF4F3;       /* r-50 */
  --note-bg: #ECF4FC;        /* n-100 */
  --focus: #B55BB3;

  --beyond: #EAEEF2;         /* the land beyond the Strip's borders: plain, unnamed */
  --sea: #DCE7F1;
  --land: #F7FBFF;
  --coast: #1A1F25;
  --water: #3F6E99;
  --glow: #B55BB3;
  --label: #1A1F25;
  --label-2: #5E646A;
  --halo: rgba(247, 251, 255, .96);
  --inset-frame: #1A1F25;

  --font: 'Readex Pro', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --r-s: 8px; --r-m: 12px;
  color-scheme: light;
}
[data-theme="dark"] {
  --ink: #F7FBFF;
  --ink-2: #9FA6AD;          /* n-400, 7.7 : 1 */
  --ground: #0D1217;         /* n-950 */
  --field: #1A1F25;          /* n-900 */
  --line: #767D84;           /* n-500, 4.0 : 1 on the field */
  --hair: #2C3137;           /* n-800 */
  --berry: #D27ED0;          /* s-400 */
  --berry-fill: #D27ED0;
  --on-berry: #0D1217;       /* 6.8 : 1 */
  --error: #FC6E68;          /* r-400, 6.8 : 1 */
  --error-bg: #370003;       /* r-950 */
  --note-bg: #2C3137;        /* n-800 */
  --focus: #D27ED0;

  --beyond: #0E1419;
  --sea: #070B0F;
  --land: #161E26;
  --coast: rgba(247, 251, 255, .34);
  --water: #6F93B8;
  --glow: #E9A6E7;
  --label: #F7FBFF;
  --label-2: #9FA6AD;
  --halo: rgba(7, 11, 15, .92);
  --inset-frame: rgba(247, 251, 255, .42);
  color-scheme: dark;
}

/* ============ base ============ */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font); font-size: 16px; line-height: 1.75; color: var(--ink); background: var(--ground);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
[lang="en"] body { line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }

.page { display: grid; grid-template-columns: minmax(464px, 560px) 1fr; min-height: 100vh; }

/* ============ the panel: one 400px column, the width of Google's button ============ */
.panel { padding: 24px 0 16px; display: flex; flex-direction: column; min-width: 0; position: relative; z-index: 1; background: var(--ground); }
.panel > * { width: min(400px, calc(100% - 32px)); margin-inline: auto; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px; }
.brand { display: inline-flex; align-items: center; min-height: 48px; border-radius: 6px; }
.logo { height: 40px; width: auto; display: block; }
.logo-ink { fill: var(--ink); } .logo-berry { fill: var(--berry); }
.switches { display: flex; align-items: center; gap: 8px; }
.switch {
  min-height: 44px; min-width: 44px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center;
  font: 500 14px/1 var(--font); color: var(--ink); text-decoration: none; background: transparent;
  border: 1px solid var(--line); border-radius: 22px; cursor: pointer;
}
.switch:hover { border-color: var(--ink); }
.switch svg { width: 20px; height: 20px; }
#theme { padding: 0; }
#theme .moon { display: block; } #theme .sun { display: none; }
[data-theme="dark"] #theme .moon { display: none; } [data-theme="dark"] #theme .sun { display: block; }

.back { display: flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 16px; color: var(--ink-2); font-size: 14px; text-decoration: none; }
.back span { padding-block: 4px; }
.back:hover span { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.back svg { width: 16px; height: 16px; flex: none; }
[dir="ltr"] .chev { transform: scaleX(-1); }

h1 { font-size: 56px; line-height: 1.15; font-weight: 700; margin-top: 8px; margin-bottom: 0; letter-spacing: 0; }
[lang="en"] h1 { letter-spacing: -0.025em; }
.lede { font-size: 18px; line-height: 1.75; color: var(--ink-2); margin-top: 16px; margin-bottom: 0; }

.stack { display: flex; flex-direction: column; gap: 24px; margin-top: 24px; }

/* notes & alerts */
.note, .alert { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: var(--r-m); font-size: 14px; line-height: 1.7; }
.note { background: var(--note-bg); color: var(--ink); }
.alert { background: var(--error-bg); color: var(--ink); }
.alert svg, .note svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
.alert svg { color: var(--error); }
.alert strong { display: block; font-weight: 600; font-size: 16px; }
.alert p, .note p { margin: 0; }
.alert-google { margin-top: 16px; }

/* Google's own button, as Google renders it (outline / filled-black, 40px, max 400px) */
.gsi {
  display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 400px; height: 40px;
  padding: 0 12px; background: #FFFFFF; color: #3C4043; border: 1px solid #DADCE0; border-radius: 4px; cursor: pointer;
  font: 500 14px/1 'Google Sans', Roboto, 'Segoe UI', Arial, sans-serif; letter-spacing: .25px;
}
.gsi:hover { background: #F8FAFF; border-color: #D2E3FC; }
.gsi .g-logo { width: 18px; height: 18px; position: absolute; inset-inline-start: 12px; top: 10px; }
.gsi .g-disc { display: contents; }
[data-theme="dark"] .gsi { background: #202124; color: #FFFFFF; border-color: #202124; }
[data-theme="dark"] .gsi .g-disc { display: flex; position: absolute; inset-inline-start: 2px; top: 2px; width: 34px; height: 34px; border-radius: 3px; background: #FFFFFF; align-items: center; justify-content: center; }
[data-theme="dark"] .gsi .g-logo { position: static; }
[data-theme="dark"] .gsi:hover { background: #2F3033; }
[lang="ar"] .gsi { letter-spacing: 0; }

.or { display: flex; align-items: center; gap: 16px; color: var(--ink-2); font-size: 14px; line-height: 1; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--hair); }

form { display: flex; flex-direction: column; gap: 24px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
label { font-size: 14px; font-weight: 500; line-height: 1.5; }
.field-head a { font-size: 14px; color: var(--ink-2); text-underline-offset: 4px; position: relative; }
.field-head a::after, .owners a::after { content: ""; position: absolute; inset: -10px -4px; }  /* a 44px target, no layout shift */
.field-head a:hover { color: var(--ink); }
.input-wrap { position: relative; }
input[type="email"], input[type="password"], input[type="text"] {
  width: 100%; height: 48px; padding: 0 16px; font: 400 16px/1 var(--font); color: var(--ink);
  background: var(--field); border: 1px solid var(--line); border-radius: var(--r-s);
}
input::placeholder { color: var(--ink-2); opacity: 1; }
input:hover { border-color: var(--ink-2); }
input:focus-visible { outline-offset: 1px; border-color: var(--ink); border-radius: var(--r-s); }
input[dir="ltr"] { text-align: left; }
.is-invalid input { border-color: var(--error); box-shadow: 0 0 0 1px var(--error); }
#password { padding-inline-end: 80px; }
.pw-toggle {
  position: absolute; inset-inline-end: 2px; top: 2px; height: 44px; min-width: 64px; padding: 0 16px; border: 0; border-radius: 6px;
  background: transparent; color: var(--ink-2); font: 500 14px/1 var(--font); cursor: pointer;
}
.pw-toggle:hover { color: var(--ink); }
.field-error { display: flex; gap: 8px; align-items: flex-start; margin: 0; color: var(--error); font-size: 14px; line-height: 1.7; }
.field-error svg { width: 16px; height: 16px; flex: none; margin-top: 4px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px; height: 48px; padding: 0 24px; border-radius: var(--r-s);
  font: 600 16px/1 var(--font); cursor: pointer; text-decoration: none; border: 0;
}
.btn-primary { width: 100%; background: var(--berry-fill); color: var(--on-berry); margin-top: 8px; }
.btn-primary:hover { filter: brightness(1.07); }
[data-theme="dark"] .btn-primary { box-shadow: 0 8px 32px -8px rgba(210, 126, 208, .5); }
.btn-primary[aria-busy="true"] { cursor: progress; }
.spinner { display: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; border-inline-end-color: transparent; animation: spin .8s linear infinite; }
.btn-primary[aria-busy="true"] .spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

/* the way in for new people */
.newcomers { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 8px; }
.newcomers-row { display: flex; align-items: center; gap: 0 8px; flex-wrap: wrap; }
.newcomers-row p { margin: 0; font-size: 16px; }
.newcomers-row a { font-weight: 600; font-size: 16px; color: var(--ink); text-underline-offset: 6px; text-decoration-thickness: 1.5px; min-height: 44px; display: inline-flex; align-items: center; }
.owners { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.75; }
.owners a { color: var(--ink); font-weight: 500; text-underline-offset: 4px; white-space: nowrap; position: relative; }

.foot { margin-top: auto; padding-top: 16px; display: flex; gap: 24px; font-size: 14px; color: var(--ink-2); }
.foot a { color: var(--ink-2); text-underline-offset: 4px; min-height: 44px; display: inline-flex; align-items: center; }
.foot a:hover { color: var(--ink); }

/* ============ the atlas ============ */
.atlas { position: sticky; top: 0; height: 100vh; min-height: 760px; overflow: hidden; background: var(--beyond); }
.atlas svg.map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.atlas .labels { position: absolute; inset: 0; pointer-events: none; }
.sea { fill: var(--sea); }
.land { fill: var(--land); stroke: var(--coast); stroke-width: 1.5; stroke-linejoin: round; }
[data-theme="dark"] .land { stroke-width: 1; }
.waterline { fill: none; stroke: var(--water); stroke-width: 1; stroke-linejoin: round; }
.inset-land-beyond { fill: var(--beyond); }
.inset-frame { fill: none; stroke: var(--inset-frame); stroke-width: 1.5; }
.inset-shadow { fill: var(--ground); filter: drop-shadow(0 12px 24px rgba(15, 30, 40, .14)); }
[data-theme="dark"] .inset-shadow { filter: drop-shadow(0 12px 32px rgba(0, 0, 0, .6)); }
.city-window { fill: none; stroke: var(--label-2); stroke-width: 1.25; }
.tether { stroke: var(--label-2); stroke-width: 1; fill: none; opacity: .6; }
.leader { stroke: var(--label-2); stroke-width: 1; fill: none; opacity: .7; }

/* a space is a soft lit window, never a point */
.light-core { fill: var(--berry); stroke: var(--land); stroke-width: 2; }
[data-theme="dark"] .light-core { fill: #F6D2F4; stroke: var(--berry); stroke-width: 2; }
.light-glow { opacity: .55; }
[data-theme="dark"] .light-glow { opacity: 1; }

/* on first load the lights fade up, softly, once */
@media (prefers-reduced-motion: no-preference) {
  html:not([data-capture]) .light { animation: on 1200ms ease-out both; animation-delay: var(--d, 0ms); }
  @keyframes on { from { opacity: 0; } to { opacity: 1; } }
}

.lbl { position: absolute; white-space: nowrap; color: var(--label); font-size: 13px; line-height: 1.4; font-weight: 500;
  text-shadow: 0 0 2px var(--halo), 0 0 4px var(--halo), 0 0 8px var(--halo), 0 0 12px var(--halo); }
.lbl small { display: block; font-size: 12px; font-weight: 400; color: var(--label-2); }
.lbl.names span { display: block; }
.lbl.w { transform: translate(-100%, -50%); text-align: right; }
.lbl.e { transform: translate(0, -50%); text-align: left; }
.lbl.w.top { transform: translate(-100%, 0); }
.lbl.e.top { transform: none; }
.lbl.inset-title { font-size: 14px; font-weight: 600; }
.lbl.place { font-size: 14px; font-weight: 600; }
.lbl.place.sm { font-size: 12px; font-weight: 500; }
.lbl.sea { font-size: 14px; font-weight: 400; color: var(--label-2); text-shadow: none; }
[lang="en"] .lbl.sea { letter-spacing: .14em; font-size: 12px; }
.lbl .is-from, .lbl.is-from { font-weight: 700; }

.legend {
  position: absolute; inset-block-end: 24px; inset-inline-start: 40px; display: flex; align-items: center; gap: 12px; margin: 0;
  font-size: 14px; color: var(--label-2); line-height: 1.6; padding: 4px 12px; border-radius: 8px; background: var(--halo);
}
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--berry); flex: none; box-shadow: 0 0 0 4px color-mix(in oklab, var(--berry) 22%, transparent); }
[data-theme="dark"] .legend i { background: #F6D2F4; box-shadow: 0 0 0 2px var(--berry), 0 0 12px 3px rgba(210, 126, 208, .55); }

/* ============ phone: a header, a short band with the whole Strip, then the form ============ */
@media (max-width: 900px) {
  .page { grid-template-columns: minmax(0, 1fr); }
  .panel { display: contents; }
  .bar { order: -2; width: auto; margin: 0; padding: 8px 16px; background: var(--ground); }
  .atlas { position: relative; order: -1; height: 216px; min-height: 0; }
  .panel > *:not(.bar) { width: min(400px, calc(100% - 32px)); margin-inline: auto; }
  .back { margin-top: 8px; }
  h1 { font-size: 40px; margin-top: 0; }
  .lede { font-size: 16px; margin-top: 8px; }
  .stack { margin-top: 24px; }
  .foot { padding-bottom: 16px; }
  /* the map is geography: its legend keeps a physical place, bottom right, in both languages */
  .legend { inset-block-end: 16px; inset-inline: auto; right: 16px; width: 188px; align-items: flex-start;
    font-size: 12px; line-height: 1.5; background: none; padding: 0; }
  .legend i { margin-top: 4px; }
}

</style>
</head>

(function () {

        (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ',' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);

  }
  function coastAt(pts, y) { /* x of the coast at screen height y (outline points 0..9) */
    for (var i = 0; i < 9; i++) { var a = pts[i], b = pts[i + 1]; if ((y - a[1]) * (y - b[1]) <= 0) return a[0] + (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]); }
    return pts[9][0];
  }
  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function isFrom(sp) { return M.state.from && M.state.from.slug === sp.slug; }

  function draw() {
    var W = atlas.clientWidth, H = atlas.clientHeight, lang = M.state.lang;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.innerHTML = ''; layer.innerHTML = '';
    /* the full map (with Gaza City's inset) needs room; a narrow or short map gets the compact one: the whole Strip,
       its four place names to the east, the legend */
    var compact = W < 640 || H < 420;
    var s, ox, oy;
    if (!compact) {
      s = Math.min((H - 136) / STRIP_H, 24);
      ox = W - 120 - STRIP_W * s; oy = 64;
    } else {
      s = Math.min((H - 32) / STRIP_H, (W - 220) / STRIP_W);
      ox = Math.max(Math.round(W * 0.14), (W - STRIP_W * s) / 2 - 80); oy = (H - STRIP_H * s) / 2;
    }
    function P(lat, lng) { return [ox + (lng - LNG0) * KX * s, oy + (LAT0 - lat) * KY * s]; }
    var pts = M.OUTLINE.map(function (p) { return P(p[0], p[1]); });

    var defs = el('defs', {});
    var g = el('radialGradient', { id: 'glow' }, defs);
    el('stop', { offset: '0', style: 'stop-color:var(--glow);stop-opacity:.55' }, g);
    el('stop', { offset: '.45', style: 'stop-color:var(--glow);stop-opacity:.18' }, g);
    el('stop', { offset: '1', style: 'stop-color:var(--glow);stop-opacity:0' }, g);

    /* the sea: everything west of the coast, the coast carried on straight past both ends of the Strip.
       The land beyond the borders keeps the atlas's own ground. */
    var coast = pts.slice(0, 10);
    var north = along(coast[1], coast[0], 6), south = along(coast[8], coast[9], 30);
    el('path', { class: 'sea', d: M0(north) + L0(coast[0]) + cr(coast) + L0(south) + 'L-10,' + (H + 10) + 'L-10,-10L' + north[0].toFixed(1) + ',-10Z' });

    /* water lines: the coast repeated out to sea, wider apart as they go */
    var a = coast[0], b = coast[9], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    var nx = (b[1] - a[1]) / len, ny = -(b[0] - a[0]) / len;
    if (nx > 0) { nx = -nx; ny = -ny; }
    var ext = [along(coast[1], coast[0], 1.2)].concat(coast, [along(coast[8], coast[9], 3)]);
    var cd = M0(ext[0]) + cr(ext);
    var fade = el('linearGradient', { id: 'wfade', gradientUnits: 'userSpaceOnUse', x1: ext[0][0], y1: ext[0][1], x2: ext[ext.length - 1][0], y2: ext[ext.length - 1][1] }, defs);
    [[0, 0], [.18, 1], [.82, 1], [1, 0]].forEach(function (st) { el('stop', { offset: st[0], 'stop-color': '#fff', 'stop-opacity': st[1] }, fade); });
    var mk = el('mask', { id: 'wmask', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: W, height: H }, defs);
    el('rect', { x: 0, y: 0, width: W, height: H, fill: 'url(#wfade)' }, mk);
    var wg = el('g', { mask: 'url(#wmask)' });
    var off = 0, step = compact ? 4 : 7;
    for (var i = 0; i < (compact ? 6 : 14); i++) {
      off += step; step *= 1.14;
      el('path', { class: 'waterline', d: cd, transform: 'translate(' + (nx * off).toFixed(1) + ',' + (ny * off).toFixed(1) + ')', opacity: (0.5 * Math.pow(0.85, i)).toFixed(3) }, wg);
    }

    el('path', { class: 'land', d: outlinePath(pts) });

    var order = M.SPACES.slice().sort(function (p, q) { return q.lat - p.lat; });
    var lights = el('g', { class: 'lights' });
    function light(x, y, sp, i, parent, size) {
      var from = isFrom(sp);
      var gg = el('g', { class: 'light' + (from ? ' is-from' : ''), style: '--d:' + (200 + i * 90) + 'ms' }, parent || lights);
      el('circle', { class: 'light-glow', cx: x, cy: y, r: size * (from ? 4.2 : 3.2), fill: 'url(#glow)' }, gg);
      var z = from ? size * 1.35 : size;
      el('rect', { class: 'light-core', x: x - z / 2, y: y - z / 2, width: z, height: z, rx: z * 0.32 }, gg);
      return gg;
    }

    var city = P(CITY.lat, CITY.lng);
    var bw = CITY.w * KX / 95 * s * 1.0, bh = CITY.h * s;   /* the window over the city on the main map */

    if (!compact) {
      order.forEach(function (sp, i) { var p = P(sp.lat, sp.lng); light(p[0], p[1], sp, i, null, IN_CITY[sp.slug] ? 4 : 9); });

      /* the inset: a rounded box out at sea, north-west of the city */
      var IW = 300, IH = IW * (CITY.h / CITY.w);
      var ix = 40, iy = 64;
      var z = IW / CITY.w;   /* px per km inside the inset */
      el('rect', { class: 'city-window', x: city[0] - bw / 2, y: city[1] - bh / 2, width: bw, height: bh, rx: 6 });
      el('path', { class: 'tether', d: M0([city[0] - bw / 2, city[1] - bh / 2]) + L0([ix + IW, iy + 24]) });
      el('rect', { class: 'inset-shadow', x: ix, y: iy, width: IW, height: IH, rx: 16 });
      var clip = el('clipPath', { id: 'iclip' }, defs);
      el('rect', { x: ix, y: iy, width: IW, height: IH, rx: 16 }, clip);
      var ig = el('g', { 'clip-path': 'url(#iclip)' });
      el('rect', { class: 'inset-land-beyond', x: ix, y: iy, width: IW, height: IH }, ig);
      function IP(lat, lng) { return [ix + IW / 2 + (lng - CITY.lng) * KX * z, iy + IH / 2 + (CITY.lat - lat) * KY * z]; }
      var ipts = M.OUTLINE.map(function (p) { return IP(p[0], p[1]); });
      var icoast = ipts.slice(0, 10);
      var inorth = along(icoast[1], icoast[0], 3), isouth = along(icoast[2], icoast[3], 4);
      el('path', { class: 'sea', d: M0(inorth) + L0(icoast[0]) + cr(icoast.slice(0, 4)) + L0(isouth) + 'L' + (ix - 10) + ',' + (iy + IH + 10) + 'L' + (ix - 10) + ',' + (iy - 10) + 'Z' }, ig);
      var o2 = 0, st2 = 8, icd = M0(icoast[0]) + cr(icoast.slice(0, 5));
      for (var j = 0; j < 6; j++) { o2 += st2; st2 *= 1.16; el('path', { class: 'waterline', d: icd, transform: 'translate(' + (nx * o2).toFixed(1) + ',' + (ny * o2).toFixed(1) + ')', opacity: (0.45 * Math.pow(0.8, j)).toFixed(3) }, ig); }
      el('path', { class: 'land', d: outlinePath(ipts) }, ig);
      el('rect', { class: 'inset-frame', x: ix, y: iy, width: IW, height: IH, rx: 16 });
      var il = el('g', { class: 'lights' });
      order.forEach(function (sp, i) {
        if (!IN_CITY[sp.slug]) return;
        var p = IP(sp.lat, sp.lng), side = IN_CITY[sp.slug];
        light(p[0], p[1], sp, i, il, 10);
        label(p[0] + (side === 'e' ? 12 : -12), p[1], side, esc(sp[lang]), isFrom(sp) ? 'is-from' : '');
      });
      label(ix + (lang === 'ar' ? IW - 16 : 16), iy + 14, lang === 'ar' ? 'w top' : 'e top', esc(M.t('gaza')), 'inset-title');

      /* the four in the south: one label per place, the names stacked over the area, east of the border */
      [['elevate', 'coma'], ['al-salam'], ['masar']].forEach(function (group) {
        var sps = group.map(function (slug) { return M.SPACES.filter(function (x) { return x.slug === slug; })[0]; });
        var ps = sps.map(function (sp) { return P(sp.lat, sp.lng); });
        var y = ps.reduce(function (t, p) { return t + p[1]; }, 0) / ps.length;
        var ex = eastAt(pts, y) + 24;
        ps.forEach(function (p) { el('path', { class: 'leader', d: M0([p[0] + 8, p[1]]) + L0([ex - 8, y]) }); });
        var html = sps.map(function (sp) { return '<span' + (isFrom(sp) ? ' class="is-from"' : '') + '>' + esc(sp[lang]) + '</span>'; }).join('') +
          '<small>' + esc(sps[0][lang === 'ar' ? 'areaAr' : 'areaEn']) + '</small>';
        label(ex, y, 'e', html, 'names');
      });

      /* the sea, named along the coast */
      var my = P(31.35, 34.3)[1], mid = [Math.max(72, coastAt(pts, my) - 110), my], ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI + 180;
      var sl = label(mid[0], mid[1], '', esc(M.t('sea')), 'sea');
      sl.style.transform = 'translate(-50%, -50%) rotate(' + ang.toFixed(1) + 'deg)';
    } else {
      order.forEach(function (sp, i) { var p = P(sp.lat, sp.lng); light(p[0], p[1], sp, i, null, Math.max(5, Math.min(9, s * 0.9))); });
      var places = [['مدينة غزة', 'Gaza City', 31.522, -2], ['النصيرات', 'Nuseirat', 31.4483, -8], ['دير البلح', 'Deir al-Balah', 31.42013, 8], ['المواصي', 'Al-Mawasi', 31.36569, 4]];
      places.forEach(function (pl) {
        var y = P(pl[2], 34.4)[1];
        label(eastAt(pts, y) + 14, y + pl[3] * Math.max(1, s / 5), 'e', esc(lang === 'ar' ? pl[0] : pl[1]), s > 8 ? 'place' : 'place sm');
      });
    }
  }

  var raf;
  M.onChange(function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); });
  window.addEventListener('resize', function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); });
  if (document.fonts) document.fonts.ready.then(draw);
})();

</script>
</body>

<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول · مساحة</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Aref Ruqaa 700 (the hand), Markazi Text 400-600 (the print). The English hand only downloads on the English page. -->
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Markazi+Text:wght@400..600&family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
<!--@include notebook.css-->
</style>
</head>
<body>
<div class="spread">
  <main class="page page-1" id="main">
    <header class="head">
      <a class="brand" href="#" data-t-label="logo" aria-label="مساحة"><!--@logo--></a>
      <div class="switches">
        <a class="switch" id="lang" href="?lang=en" hreflang="en" lang="en">English</a>
        <button class="switch" id="theme" type="button" aria-pressed="false" aria-label="الوضع الداكن">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <a class="back" href="#" id="back">
      <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
      <span id="back-label">العودة إلى الرئيسية</span>
    </a>

    <h1><span class="title-wrap"><span data-t="title">تسجيل الدخول</span><svg class="underline" viewBox="0 0 300 18" preserveAspectRatio="none" aria-hidden="true"><path d="M3,12 C40,7 80,13 130,9 C180,5 230,12 297,6"/><path d="M40,15 C110,12 190,15 262,11" class="u2"/></svg></span></h1>
    <p class="lede" data-t="desc">سجّل الدخول لحفظ مساحاتك المفضّلة ومتابعة بلاغاتك، أو لإدارة مساحتك.</p>

    <div class="stack">
      <div class="note" id="session-note" role="status" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 5.5V10l3 2"/></svg>
        <p data-alert-body></p>
      </div>

      <div>
        <button class="gsi" id="google" type="button"><span class="g-disc"><!--@g--></span><span data-t="google">المواصلة باستخدام Google</span></button>
        <div class="alert alert-google" id="google-alert" role="alert" tabindex="-1" hidden>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4.5M10 13.6v.1"/></svg>
          <p><strong data-alert-title></strong></p>
        </div>
      </div>

      <div class="or" data-t="or">أو</div>

      <div class="alert" id="alert" role="alert" tabindex="-1" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4.5M10 13.6v.1"/></svg>
        <div><strong data-alert-title></strong><p data-alert-body></p></div>
      </div>

      <form id="signin" novalidate>
        <div class="field">
          <label for="email" data-t="email">البريد الإلكتروني</label>
          <input id="email" name="email" type="email" dir="ltr" autocomplete="email" inputmode="email" spellcheck="false" placeholder="name@example.com" aria-describedby="email-error">
          <p class="field-error" id="email-error" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.5v4M8 11v.1" stroke="var(--paper)" stroke-width="1.6" stroke-linecap="round"/></svg><span data-error-text></span></p>
        </div>
        <div class="field">
          <div class="field-head">
            <label for="password" data-t="password">كلمة المرور</label>
            <a href="#" data-t="forgot">نسيت كلمة المرور؟</a>
          </div>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error">
            <button class="pw-toggle" id="pw-toggle" type="button" aria-pressed="false"><span data-pw-label>إظهار</span></button>
          </div>
          <p class="field-error" id="password-error" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.5v4M8 11v.1" stroke="var(--paper)" stroke-width="1.6" stroke-linecap="round"/></svg><span data-error-text></span></p>
        </div>
        <button class="btn btn-primary" id="submit" type="submit" aria-busy="false"><span class="spinner" aria-hidden="true"></span><span data-submit-label>تسجيل الدخول</span></button>
      </form>
    </div>
  </main>

  <section class="page page-2" aria-labelledby="new-title">
    <h2 id="new-title" data-t="noAccount">ليس لديك حساب؟</h2>
    <a class="btn btn-drawn" href="#" data-t="create">إنشاء حساب</a>

    <div class="owners-block">
      <p class="margin-note" data-t="ownersNote">لأصحاب المساحات</p>
      <p class="owners"><span data-t="owners">تدير مساحة عمل؟ حسابات أصحاب المساحات ينشئها فريق مساحة.</span> <a href="#" data-t="contact">تواصل معنا</a></p>
    </div>

    <figure class="desk">
      <!--@include notebook-sketch.svg-->
    </figure>

    <footer class="foot"><a href="#" data-t="privacy">سياسة الخصوصية</a></footer>
  </section>
</div>

<script>
window.MASAHA_EXTRA = {
  ar: { ownersNote: 'لأصحاب المساحات' },
  en: { ownersNote: 'For space owners' }
};
/*@shared*/
</script>
</body>
</html>

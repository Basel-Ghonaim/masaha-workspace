<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول · مساحة</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Kufam 900 for the title only; IBM Plex Sans Arabic 400 and 600 for everything you read. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Kufam:wght@900&display=swap" rel="stylesheet">
<style>
<!--@include berry.css-->
</style>
</head>
<body>
<div class="page">
  <header class="bar">
    <a class="brand" href="#" data-t-label="logo" aria-label="مساحة"><!--@logo--></a>
    <div class="switches">
      <a class="switch" id="lang" href="?lang=en" hreflang="en" lang="en">English</a>
      <button class="switch" id="theme" type="button" aria-pressed="false" aria-label="الوضع الداكن">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="main">
    <section class="intro">
      <a class="back" href="#" id="back">
        <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
        <span id="back-label">العودة إلى الرئيسية</span>
      </a>
      <h1 data-t="title">تسجيل الدخول</h1>
      <p class="lede" data-t="desc">سجّل الدخول لحفظ مساحاتك المفضّلة ومتابعة بلاغاتك، أو لإدارة مساحتك.</p>

    </section>

    <div class="sheet">
      <div class="note" id="session-note" role="status" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 5.5V10l3 2"/></svg>
        <p data-alert-body></p>
      </div>

      <div class="google-block">
        <button class="gsi" id="google" type="button"><span class="g-disc"><!--@g--></span><span data-t="google">المواصلة باستخدام Google</span></button>
        <div class="alert alert-google" id="google-alert" role="alert" tabindex="-1" hidden>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4.5M10 13.6v.1"/></svg>
          <p><strong data-alert-title></strong></p>
        </div>
      </div>

      <div class="or" data-t="or">أو</div>

      <div class="alert" id="alert" role="alert" tabindex="-1" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4.5M10 13.6v.1"/></svg>
        <div><strong data-alert-title></strong><p data-alert-body></p></div>
      </div>

      <form id="signin" novalidate>
        <div class="field">
          <label for="email" data-t="email">البريد الإلكتروني</label>
          <input id="email" name="email" type="email" dir="ltr" autocomplete="email" inputmode="email" spellcheck="false" placeholder="name@example.com" aria-describedby="email-error">
          <p class="field-error" id="email-error" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.5v4M8 11v.1" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/></svg><span data-error-text></span></p>
        </div>
        <div class="field">
          <div class="field-head">
            <label for="password" data-t="password">كلمة المرور</label>
            <a href="#" data-t="forgot">نسيت كلمة المرور؟</a>
          </div>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error">
            <button class="pw-toggle" id="pw-toggle" type="button" aria-pressed="false"><span data-pw-label>إظهار</span></button>
          </div>
          <p class="field-error" id="password-error" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.5v4M8 11v.1" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/></svg><span data-error-text></span></p>
        </div>
        <button class="btn btn-primary" id="submit" type="submit" aria-busy="false"><span class="spinner" aria-hidden="true"></span><span data-submit-label>تسجيل الدخول</span></button>
      </form>
    </div>

    <section class="newcomers" aria-labelledby="new-title">
      <div class="newcomers-row">
        <p id="new-title" data-t="noAccount">ليس لديك حساب؟</p>
        <a class="btn btn-paper" href="#" data-t="create">إنشاء حساب</a>
      </div>
      <p class="owners"><span data-t="owners">تدير مساحة عمل؟ حسابات أصحاب المساحات ينشئها فريق مساحة.</span> <a href="#" data-t="contact">تواصل معنا</a></p>
    </section>
  </main>

  <footer class="table">
    <div class="frieze-wrap">
      <!--@include berry-frieze.svg-->
    </div>
    <div class="table-band">
      <a href="#" data-t="privacy">سياسة الخصوصية</a>
    </div>
  </footer>
</div>

<script>
/*@shared*/
</script>
</body>
</html>
